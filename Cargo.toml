[workspace]
members = [".", "crates/glam-gc"]
resolver = "3"

[package]
name = "glam"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Private repository verification mode. This is not a supported embedding
# policy or public runtime switch.
aggressive-gc-verification = ["glam-gc/deterministic-test-hooks"]

[dependencies]
bytes = "1.10.1"
chumsky = "0.13.0"
fingertrees = "0.2.11"
glam-gc = { path = "crates/glam-gc" }
internment = "0.8.6"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-rational = "0.4.2"
num-traits = "0.2.19"
regex-lite = "0.1.9"
rpds = "1.2.1"
sha2 = "0.10.9"

[dev-dependencies]
glam-gc = { path = "crates/glam-gc", features = ["deterministic-test-hooks"] }
quote = "1.0"
syn = { version = "2.0.106", features = ["full", "visit"] }

[profile.release]
opt-level = 3

[profile.release-small]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
