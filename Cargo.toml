[workspace]
members = [".", "crates/glam-gc"]
resolver = "3"

[workspace.package]
# Matches the pinned toolchain in `rust-toolchain.toml`. Cargo rejects older
# compilers with an explicit version error instead of an obscure build failure.
rust-version = "1.99"

[package]
name = "glam"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[features]
default = []
# Private repository verification mode. This is not a supported embedding
# policy or public runtime switch.
aggressive-gc-verification = ["glam-gc/deterministic-test-hooks"]
# Compile profiling counters and phase timers into every runtime; the `glam`
# binary writes them as JSON to the path in `GLAM_PROF`. This is a profiling
# build mode, not a runtime or Glam-language option.
glam-prof = []

[dependencies]
bytes = "1.10.1"
chumsky = "0.13.0"
fingertrees = "0.2.11"
glam-gc = { path = "crates/glam-gc" }
internment = "0.8.6"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-rational = "0.4.2"
num-traits = "0.2.19"
regex-lite = "0.1.9"
rpds = "1.2.1"
sha2 = "0.10.9"

[dev-dependencies]
glam-gc = { path = "crates/glam-gc", features = ["deterministic-test-hooks"] }
quote = "1.0"
syn = { version = "2.0.106", features = ["full", "visit"] }

# Line tables keep backtraces and profiler line attribution but drop the
# variable-level debug info that made the debug target tens of gigabytes.
# Override with `debug = true` and `opt-level = 0` locally when stepping in a
# debugger. The workspace builds at opt-level 1, which runs the test suite about four
# times faster for a few seconds more per rebuild; debug assertions and
# overflow checks stay on. Dependencies build once, fully optimized, which
# makes the `syn` source audits four times faster.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3

[profile.release-small]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
